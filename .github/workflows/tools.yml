name: Build tools

# Small Windows helpers Conversio puts into bottles, published as a "tools-N" release.
on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  tools:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Build CEF wrapper
        run: make -C tools/steamwebhelper CC=x86_64-w64-mingw32-gcc

      - name: Build NVAPI version proxy
        run: make -C tools/nvapi-version-proxy CC=x86_64-w64-mingw32-gcc

      - name: Publish
        run: |
          set -euo pipefail
          mkdir -p dist
          # One binary under two names: older Conversio builds download steamwebhelper-wrapper.exe.
          cp tools/steamwebhelper/steamwebhelper-wrapper.exe dist/cef-wrapper.exe
          cp tools/steamwebhelper/steamwebhelper-wrapper.exe dist/
          cp tools/nvapi-version-proxy/nvapi-version-proxy.dll dist/
          (cd dist && sha256sum nvapi-version-proxy.dll > nvapi-version-proxy.dll.sha256 && sha256sum cef-wrapper.exe > cef-wrapper.exe.sha256 && sha256sum steamwebhelper-wrapper.exe > steamwebhelper-wrapper.exe.sha256)
          TAG="tools-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<NOTES
          Windows helpers for Conversio, built from \`tools/\` at ${GITHUB_SHA}.

          - \`cef-wrapper.exe\` takes the place of a CEF helper and starts \`<name>_real.exe\` with switches picked by its own name: \`steamwebhelper.exe\` gets \`--disable-gpu --single-process\`, Rockstar's \`SocialClubHelper.exe\` gets \`--in-process-gpu --disable-gpu --disable-gpu-compositing --disable-software-rasterizer\`.
          - \`steamwebhelper-wrapper.exe\` is the same file under its old name, for older Conversio builds.
          - \`nvapi-version-proxy.dll\` forwards NVAPI to the imported GPTK; only two driver-version replies can be raised by per-executable AppDefaults. Apple libraries are not redistributed.
          NOTES
          gh release create "$TAG" dist/* --title "Tools ${GITHUB_RUN_NUMBER}" --notes-file notes.md --target "$GITHUB_SHA" --latest=false
