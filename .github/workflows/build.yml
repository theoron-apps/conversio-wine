name: Build Wine

on:
  workflow_dispatch:
    inputs:
      cx_version:
        description: CrossOver source version
        default: "26.3.0"
        type: string
      revision:
        description: Our build number for this CrossOver version (bump when patches change)
        default: "10"
        type: string
      cx_sha256:
        description: SHA-256 of the source tarball, only for a version not pinned in scripts/build.sh
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "patches/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    # Explicit bash turns on pipefail, so `cmd | tee log` still fails when cmd fails.
    shell: bash

jobs:
  build:
    name: Wine ${{ inputs.cx_version || '26.3.0' }} (x86_64)
    # Wine for macOS is an Intel program; an Intel runner gives native x86_64 Homebrew libraries.
    runs-on: macos-15-intel
    timeout-minutes: 330
    env:
      CX_VER: ${{ inputs.cx_version || '26.3.0' }}
      REVISION: ${{ inputs.revision || '10' }}
      CX_SHA256: ${{ inputs.cx_sha256 }}
      CC: ccache clang
      CXX: ccache clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          echo "macOS $(sw_vers -productVersion) $(uname -m), $(sysctl -n hw.ncpu) CPUs"
          # sed reads everything; head would close the pipe early and crash xcodebuild.
          xcodebuild -version | sed -n 1p
          df -h "$GITHUB_WORKSPACE" | tail -1

      - name: Cache CrossOver sources
        uses: actions/cache@v4
        with:
          path: build/crossover-sources-${{ env.CX_VER }}.tar.gz
          key: crossover-sources-${{ env.CX_VER }}

      - name: Cache Wine Mono and Gecko
        uses: actions/cache@v4
        with:
          path: build/addons
          key: wine-addons-${{ env.CX_VER }}

      - name: Cache compiler results
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ env.CX_VER }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.CX_VER }}-
            ccache-

      - name: Install dependencies
        run: scripts/build.sh deps

      - name: Fetch sources
        run: scripts/build.sh fetch

      - name: Apply patches
        run: scripts/build.sh apply

      - name: Build GStreamer
        run: scripts/build.sh gstreamer > build/gstreamer.log 2>&1 || { tail -n 150 build/gstreamer.log; exit 1; }

      - name: Configure
        run: scripts/build.sh configure 2>&1 | tee build/configure.log

      - name: Build
        run: scripts/build.sh build > build/make.log 2>&1 || { tail -n 200 build/make.log; exit 1; }

      - name: Install
        run: scripts/build.sh install

      - name: Add Wine Mono and Gecko
        run: scripts/build.sh addons

      - name: Bundle libraries
        run: scripts/build.sh bundle

      - name: Prepare diagnostic candidate
        run: |
          x86_64-w64-mingw32-gcc tests/media/mf-video.c -o build/mf-video.exe -lmfreadwrite -lmfplat -lmfuuid -lole32
          XZ_OPT='-T0 -1' tar -C build/stage -cJf build/wine-candidate.tar.xz wine

      # This unpublished artifact is deliberately excluded from Publish Wine's
      # conversio-wine-* pattern. It allows diagnosis on an interactive Mac
      # while the mandatory CI cmd/MF gates remain unchanged.
      - name: Upload diagnostic candidate
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-wine-${{ github.run_id }}
          path: |
            build/wine-candidate.tar.xz
            build/mf-video.exe
            tests/media/h264-aac.mp4
          retention-days: 7

      - name: Native packaged media test
        run: scripts/build.sh test-native

      - name: Package
        run: scripts/build.sh package

      - name: Compiler cache stats
        if: always()
        run: command -v ccache >/dev/null && ccache -s || true

      - name: Save compiler results
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ env.CX_VER }}-${{ github.run_id }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: conversio-wine-cx${{ env.CX_VER }}-${{ env.REVISION }}
          path: dist/
          retention-days: 14

      - name: Upload Windows media probe
        uses: actions/upload-artifact@v4
        with:
          name: wine-smoke-probe-${{ github.run_id }}
          path: build/mf-video.exe

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-cx${{ env.CX_VER }}-${{ env.REVISION }}
          path: |
            build/gstreamer.log
            build/gst-build/meson-logs/meson-log.txt
            build/configure.log
            build/make.log
            build/wine-build/config.log
            build/smoke-test.log
            build/mf-video.log
            build/gst-inspect-*.log
          if-no-files-found: ignore

  smoke:
    name: Windows cmd and Media Foundation (Apple silicon)
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rosetta
        run: arch -x86_64 /usr/bin/true
      - uses: actions/download-artifact@v4
        with:
          name: conversio-wine-cx${{ inputs.cx_version || '26.3.0' }}-${{ inputs.revision || '10' }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: wine-smoke-probe-${{ github.run_id }}
          path: probe
      - name: Extract exact release archive
        run: |
          cd dist
          shasum -a 256 -c conversio-wine-*.tar.xz.sha256
          mkdir -p ../build/stage
          tar -xJf conversio-wine-*-x86_64.tar.xz -C ../build/stage
      - name: Required Windows startup and H264 decode
        run: tests/media/check-headless.sh "$PWD/build/stage/wine" "$PWD/probe/mf-video.exe" "$PWD/tests/media/h264-aac.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-logs-${{ github.run_id }}
          path: build/headless-*.log
